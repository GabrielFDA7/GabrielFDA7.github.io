name: CI

on:
  # Na main, este CI roda dentro do workflow Publicar, como portão antes de ir ao ar.
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # O Mermaid desenha os diagramas no build, e as verificações abrem o site em um navegador.
      - run: npx playwright install --with-deps chromium

      - name: Tipos
        run: npm run check

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      - name: Links, marcadores e SEO
        run: node scripts/verificar-dist.mjs --externos

      - name: Navegador (acessibilidade, layout, filtro, tema)
        run: npm run verificar:navegador

      - name: Lighthouse (95 ou mais no celular)
        run: npm run lighthouse

      # Só quando o Publicar chama este CI: o dist/ que acabou de passar em tudo vira o site.
      - name: Guarda o site verificado para publicar
        if: github.workflow == 'Publicar'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
